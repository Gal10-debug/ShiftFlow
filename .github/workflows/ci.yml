name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-correctness:
    name: Backend correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_PROCESSOR_COUNT: '2'
      RUN_POSTGRES_TESTS: '1'
      SCHEDULING_VALIDATION_REPORT_DIRECTORY: ${{ github.workspace }}/TestResults/scheduling-validation
      # Disposable service credentials only; never use repository secrets here.
      TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=shiftflow_ci;Username=shiftflow_ci;Password=ci-only-disposable
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=shiftflow_ci;Username=shiftflow_ci;Password=ci-only-disposable
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_DB: shiftflow_ci
          POSTGRES_USER: shiftflow_ci
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow_ci -d shiftflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies and EF tools
        run: |
          dotnet restore ShiftManager.slnx
          dotnet tool restore
      - name: Build Release with warnings as errors
        run: dotnet build ShiftManager.slnx -c Release --no-restore --warnaserror
      - name: Apply migrations to clean service database
        run: dotnet ef database update --project src/ShiftManager --configuration Release --no-build
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/ShiftManager --configuration Release --no-build
      - name: Verify image health and disposable volume durability
        run: python3 scripts/test-postgres-image.py
      - name: Verify performance timing report parsing
        run: python3 scripts/test-performance.py
      - name: Run correctness and security tests against isolated service databases
        env:
          TEST_TIMING_DIRECTORY: ${{ github.workspace }}/TestResults/fixtures
        run: dotnet test ShiftManager.slnx -c Release --no-build --no-restore --filter 'Category!=SchedulingBenchmark' --results-directory TestResults/correctness --logger "trx;LogFileName=backend.trx"
      - name: Summarize per-test and class timings
        if: always()
        run: python3 scripts/summarize-performance.py --trx 'TestResults/correctness/*.trx' --output TestResults/timing/correctness.json
      - name: Publish timing fields and synthetic solver diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-correctness-timing
          path: |
            TestResults/timing/
            TestResults/fixtures/
            TestResults/scheduling-validation/
          if-no-files-found: error
          retention-days: 7

  scheduling-benchmarks:
    name: Scheduling benchmarks (${{ matrix.budget }}s)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        budget: [30, 60, 120]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_PROCESSOR_COUNT: '2'
      SCHEDULING_BENCHMARK_BUDGETS: ${{ matrix.budget }}
      SCHEDULING_BENCHMARK_SCENARIOS: normal,severe-shortage
      SCHEDULING_VALIDATION_REPORT_DIRECTORY: ${{ github.workspace }}/TestResults/scheduling-validation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build Release
        run: |
          dotnet restore ShiftManager.slnx
          dotnet build ShiftManager.slnx -c Release --no-restore --warnaserror
      - name: Run both required monthly scenarios at this unchanged budget
        run: dotnet test ShiftManager.slnx -c Release --no-build --no-restore --filter 'Category=SchedulingBenchmark' --results-directory TestResults/benchmarks --logger "trx;LogFileName=benchmarks.trx"
      - name: Summarize scheduling benchmark quality and proof status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["SCHEDULING_VALIDATION_REPORT_DIRECTORY"]) / "priority-benchmarks.json"
          lines = ["## Scheduling benchmark results", "",
                   "A passing test run does not establish pilot acceptance for unproven or missed quality targets.", ""]
          if not report.is_file():
              raise SystemExit("Required benchmark report missing; the test/build may have stopped before benchmarking.")
          else:
              trials = json.loads(report.read_text())
              budget = int(os.environ["SCHEDULING_BENCHMARK_BUDGETS"])
              assert {(t["Scenario"], t["BudgetSeconds"]) for t in trials} == {("normal", budget), ("severe-shortage", budget)}
              assert len(trials) == 2, "Each matrix job must execute exactly its two benchmark scenarios"
              lines += ["| Scenario | Budget (s) | Status | Proven stages | Critical value / bound | Fairness status | Fairness value / bound | Quality target | Max cohort spread |",
                        "| --- | ---: | --- | ---: | --- | --- | --- | --- | ---: |"]
              for trial in trials:
                  stages = {s["Objective"]: s for s in trial.get("Stages") or []}
                  critical = stages.get("CRITICAL_COVERAGE", {})
                  stage = stages.get("FAIRNESS", {})
                  fairness = trial.get("Fairness") or {}
                  spread = max((c["Maximum"] - c["Minimum"] for c in fairness.get("Cohorts", [])), default="N/A")
                  outcome = fairness.get("Outcome", "N/A")
                  lines.append(f"| {trial['Scenario']} | {trial['BudgetSeconds']} | {trial['Status']} | {trial['ProvenObjectives']} | "
                               f"{critical.get('Value')} / {critical.get('Bound')} | {stage.get('Status', 'NOT_RUN')} | "
                               f"{stage.get('Value')} / {stage.get('Bound')} | {outcome} | {spread} |")
                  if outcome in ("UNPROVEN_TARGET_NOT_MET", "PROVEN_TARGET_VIOLATION"):
                      print(f"::warning::Scheduling benchmark {trial['Scenario']} at {trial['BudgetSeconds']} seconds: {outcome}; cohort spread {spread}. Review before pilot acceptance.")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          PY

      - name: Summarize benchmark test timing
        if: always()
        run: python3 scripts/summarize-performance.py --trx 'TestResults/benchmarks/*.trx' --output TestResults/timing/benchmarks.json
      - name: Publish timing fields and synthetic solver diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduling-benchmark-${{ matrix.budget }}s
          path: |
            TestResults/timing/
            TestResults/scheduling-validation/
          if-no-files-found: error
          retention-days: 7

  backend:
    # Preserve the existing required check name. Skipped/cancelled dependencies fail closed.
    name: Backend
    if: always()
    needs: [backend-correctness, scheduling-benchmarks, pilot-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require correctness, security and all six benchmark experiments
        env:
          CORRECTNESS: ${{ needs.backend-correctness.result }}
          BENCHMARKS: ${{ needs.scheduling-benchmarks.result }}
          PILOT: ${{ needs.pilot-deployment.result }}
        run: test "$CORRECTNESS" = success && test "$BENCHMARKS" = success && test "$PILOT" = success

  pilot-deployment:
    name: Production pilot package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify operation guards
        run: python3 scripts/test-pilot.py
      - name: Build the actual Production images
        run: |
          docker build -f deploy/pilot/Dockerfile -t shiftflow-pilot:phase7e-local .
          docker build -f deploy/pilot/Dockerfile.proxy -t shiftflow-pilot-proxy:phase7e-local .
      - name: Validate HTTPS, synthetic workflow, failures and separate-database recovery
        run: python3 scripts/test-pilot-deployment.py
      - name: Publish status-only deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-deployment-validation
          path: TestResults/phase7e/deployment-validation.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build production assets and validate TypeScript
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate E2E types and artifact redaction
        working-directory: frontend
        run: |
          npm run typecheck:e2e
          npm run test:e2e:safety
      - name: Run browser workflows with owned disposable PostgreSQL
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve sanitized workflow diagnostics
        if: always()
        run: |
          if [ -d frontend/e2e-report ]; then cp -R frontend/e2e-report frontend/e2e-workflow-report; fi
      - name: Run bounded pilot performance and owned failure recovery checks
        working-directory: frontend
        run: npm run test:performance
      - name: Publish sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-sanitized-report
          path: |
            frontend/e2e-workflow-report/
            frontend/e2e-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove containers owned by this isolated job after interruption
        if: always()
        run: |
          docker ps -aq --filter label=shiftflow.e2e.run | xargs -r docker rm -f

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore dependency graphs
        run: |
          dotnet restore ShiftManager.slnx
          npm ci --prefix frontend
      - name: Test fail-closed scanner installation
        run: python3 scripts/test-install-gitleaks.py
      - name: Cache pinned Gitleaks archive
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        # Cache availability is optional; installation and the scan must succeed.
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/gitleaks-cache
          key: gitleaks-linux-x64-8.30.1-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: Install checksum-verified Gitleaks
        run: python3 scripts/install-gitleaks.py --cache-dir "${{ runner.temp }}/gitleaks-cache" --install-dir "${{ runner.temp }}/gitleaks-bin"
      - name: Audit dependencies and redact secret-scan findings
        run: python3 scripts/security-audit.py --gitleaks "${{ runner.temp }}/gitleaks-bin/gitleaks"
