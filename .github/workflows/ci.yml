name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ASPNETCORE_ENVIRONMENT: CI
      RUN_POSTGRES_TESTS: '1'
      SCHEDULING_VALIDATION_REPORT_DIRECTORY: ${{ github.workspace }}/TestResults/scheduling-validation
      # Disposable service credentials only; never use repository secrets here.
      TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=shiftflow_ci;Username=shiftflow_ci;Password=ci-only-disposable
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=shiftflow_ci;Username=shiftflow_ci;Password=ci-only-disposable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shiftflow_ci
          POSTGRES_USER: shiftflow_ci
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow_ci -d shiftflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies and EF tools
        run: |
          dotnet restore ShiftManager.slnx
          dotnet tool restore
      - name: Build Release with warnings as errors
        run: dotnet build ShiftManager.slnx -c Release --no-restore --warnaserror
      - name: Apply migrations to clean service database
        run: dotnet ef database update --project src/ShiftManager --configuration Release --no-build
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/ShiftManager --configuration Release --no-build
      - name: Run all backend tests against isolated service databases
        run: dotnet test ShiftManager.slnx -c Release --no-build --no-restore --logger "trx;LogFileName=backend.trx"
      - name: Summarize scheduling benchmark quality and proof status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["SCHEDULING_VALIDATION_REPORT_DIRECTORY"]) / "priority-benchmarks.json"
          lines = ["## Scheduling benchmark results", "",
                   "A passing test run does not establish pilot acceptance for unproven or missed quality targets.", ""]
          if not report.is_file():
              lines.append("No benchmark report was produced; the test/build may have stopped before benchmarking.")
          else:
              trials = json.loads(report.read_text())
              lines += ["| Scenario | Budget (s) | Status | Proven stages | Critical value / bound | Fairness status | Fairness value / bound | Quality target | Max cohort spread |",
                        "| --- | ---: | --- | ---: | --- | --- | --- | --- | ---: |"]
              for trial in trials:
                  stages = {s["Objective"]: s for s in trial.get("Stages") or []}
                  critical = stages.get("CRITICAL_COVERAGE", {})
                  stage = stages.get("FAIRNESS", {})
                  fairness = trial.get("Fairness") or {}
                  spread = max((c["Maximum"] - c["Minimum"] for c in fairness.get("Cohorts", [])), default="N/A")
                  outcome = fairness.get("Outcome", "N/A")
                  lines.append(f"| {trial['Scenario']} | {trial['BudgetSeconds']} | {trial['Status']} | {trial['ProvenObjectives']} | "
                               f"{critical.get('Value')} / {critical.get('Bound')} | {stage.get('Status', 'NOT_RUN')} | "
                               f"{stage.get('Value')} / {stage.get('Bound')} | {outcome} | {spread} |")
                  if outcome in ("UNPROVEN_TARGET_NOT_MET", "PROVEN_TARGET_VIOLATION"):
                      print(f"::warning::Scheduling benchmark {trial['Scenario']} at {trial['BudgetSeconds']} seconds: {outcome}; cohort spread {spread}. Review before pilot acceptance.")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build production assets and validate TypeScript
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate E2E types and artifact redaction
        working-directory: frontend
        run: |
          npm run typecheck:e2e
          npm run test:e2e:safety
      - name: Run browser workflows with owned disposable PostgreSQL
        working-directory: frontend
        run: npm run test:e2e
      - name: Publish sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-sanitized-report
          path: frontend/e2e-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove containers owned by this isolated job after interruption
        if: always()
        run: |
          docker ps -aq --filter label=shiftflow.e2e.run | xargs -r docker rm -f

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore dependency graphs
        run: |
          dotnet restore ShiftManager.slnx
          npm ci --prefix frontend
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Audit dependencies and redact secret-scan findings
        run: python3 scripts/security-audit.py --gitleaks "${{ runner.temp }}/gitleaks"
