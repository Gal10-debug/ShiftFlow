# Dedicated local demo instance. No normal development volume or service is used.
services:
  demo-postgres:
    # Applying this image to existing demo data requires a separately approved maintenance window.
    image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: ${DEMO_DATABASE:-shiftflow_demo_202611_42}
      POSTGRES_USER: shiftflow_demo
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set a random password in ignored .env.demo}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftflow_demo -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
