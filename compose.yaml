services:
  postgres:
    # Applying this image to existing development data requires approved maintenance.
    image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: shiftmanager
      POSTGRES_USER: shiftmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftmanager -d shiftmanager"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
